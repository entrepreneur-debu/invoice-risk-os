name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.19"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  backend:
    name: Backend (lint, types, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag exists upstream
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests (no services, mock AI; no Gemini key needed)
        run: uv run pytest -m "not integration and not e2e"
      - name: Runtime imports without dev dependencies
        # Catches imports of dev-only packages (e.g. type stubs) from application code.
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python -c "import app.main, app.cli, app.worker.tasks, app.ai, app.ai.gemini, app.healthcheck"

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  security:
    name: Repository security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag exists upstream
        with:
          version: ${{ env.UV_VERSION }}
      - name: Python dependency audit (pip-audit)
        working-directory: apps/backend
        run: |
          uv export --frozen --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit --disable-pip --no-deps -r /tmp/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm dependency audit (production dependencies, high+)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  stack:
    name: Docker stack (build, integration, end-to-end, smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Create environment file from template (mock AI, no secrets)
        run: cp .env.example .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        run: |
          set -a && . ./.env && set +a
          ./scripts/smoke-test.sh
      - uses: astral-sh/setup-uv@v10.2.0 # no floating v10 tag exists upstream
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - name: Integration tests (PostgreSQL, Redis, MinIO, Celery, migrations)
        working-directory: apps/backend
        run: |
          uv sync --frozen --python 3.12
          uv run pytest -m integration
      - name: End-to-end workflow through the running stack
        working-directory: apps/backend
        run: uv run pytest -m e2e
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down --volumes
